services:
  analyze_aio.storage:
    class: Drupal\analyze_aio\Service\AioStorageService
    arguments: ['@database', '@config.factory', '@datetime.time']

  analyze_aio.content_inspector:
    class: Drupal\analyze_aio\Service\ContentInspectorService
    arguments: ['@entity_type.manager', '@renderer', '@config.factory', '@request_stack']

  logger.channel.analyze_aio:
    parent: logger.channel_base
    arguments: ['analyze_aio']

  Drupal\analyze_aio\Hook\AnalyzeAioHooks:
    class: Drupal\analyze_aio\Hook\AnalyzeAioHooks
    autowire: true
    arguments:
      - '@analyze_aio.storage'
      - '@current_user'

  Drupal\analyze_aio\Hook\AnalyzeAioViewsHooks:
    class: Drupal\analyze_aio\Hook\AnalyzeAioViewsHooks
    autowire: true
